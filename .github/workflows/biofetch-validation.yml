name: Biofetch validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: biofetch-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: validate-biofetch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Check module files
        run: |
          go mod tidy -diff
          go mod verify

      - name: Run tests
        run: go test ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Run vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./...

      - name: Build CLI
        run: go build -trimpath -o "$RUNNER_TEMP/biofetch" ./cmd/biofetch

      - name: Run CLI smoke checks
        run: |
          "$RUNNER_TEMP/biofetch" --version
          "$RUNNER_TEMP/biofetch" --help
          "$RUNNER_TEMP/biofetch" manifest build --help
          "$RUNNER_TEMP/biofetch" completion bash >/dev/null
