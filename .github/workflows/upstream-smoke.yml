name: Upstream compatibility smoke

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: bounded-source-probes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Probe documented endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke"
          failures=0
          probe() {
            local name="$1" url="$2" expected="$3" headers="$RUNNER_TEMP/smoke/${1}.headers"
            local status
            status="$(curl --fail-with-body --silent --show-error --location --max-time 20 --retry 2 --retry-delay 2 --max-filesize 1048576 --range 0-0 -D "$headers" -o /dev/null -w '%{http_code}' "$url" || true)"
            printf '%s\t%s\t%s\n' "$name" "$status" "$url" | tee -a "$RUNNER_TEMP/smoke/results.tsv"
            if [[ ! "$status" =~ $expected ]]; then
              echo "unexpected status for $name: $status (expected $expected)" >&2
              failures=$((failures + 1))
            fi
          }
          : >"$RUNNER_TEMP/smoke/results.tsv"
          # Providers may honor the one-byte range with 206 or ignore it with
          # 200; both are bounded, body-discarded compatibility responses.
          probe reactome-version 'https://reactome.org/ContentService/data/database/version' '^(200|206)$'
          probe kegg-info 'https://rest.kegg.jp/info/kegg' '^(200|206)$'
          probe jaspar-api 'https://jaspar.elixir.no/api/v1/' '^(200|206)$'
          probe rhea-release 'https://ftp.expasy.org/databases/rhea/rhea-release.properties' '^(200|206)$'
          probe hmdb-browser-authorization 'https://hmdb.ca/system/downloads/current/hmdb_metabolites.zip' '^(401|403)$'
          if ((failures > 0)); then
            echo "${failures} upstream probe(s) failed" >&2
            exit 1
          fi

      - name: Upload bounded smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn
